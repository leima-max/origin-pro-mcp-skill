name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Verify tool registration
        run: python -c "import origin_pro_mcp.server; from origin_pro_mcp.app import mcp; assert len(mcp._tool_manager._tools) == 23"
      - name: Run tests without Origin
        env:
          ORIGIN_MCP_SKIP_ORIGIN: "1"
        run: python -m pytest -q
